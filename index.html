<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3efe6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171513" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="观点手册">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>观点手册</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700;900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3efe6; --paper:#fbf9f4; --ink:#1d1b18; --ink2:#5b5650; --ink3:#8f8981;
  --line:#e2dccf; --accent:#c23b22; --accent-soft:#f6e1d9; --chip:#ece6d9;
  --serif:"Noto Serif SC","Songti SC",serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  --top:env(safe-area-inset-top,0px); --bot:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#171513;--paper:#201d1a;--ink:#ece6dc;--ink2:#b3aca2;--ink3:#7d776f;--line:#34302b;--accent:#e2674d;--accent-soft:#3a241e;--chip:#2a2622}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.7}
body{padding-top:var(--top);padding-bottom:calc(64px + var(--bot))}
a{color:var(--accent)}
.wrap{max-width:680px;margin:0 auto;padding:0 18px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* header */
.mast{padding:28px 0 8px}
.mast .kicker{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--ink3);text-transform:uppercase}
.mast h1{font-family:var(--serif);font-weight:900;font-size:34px;line-height:1.15;margin:6px 0 4px;letter-spacing:.02em}
.mast h1 span{color:var(--accent)}
.mast .stats{font-size:13px;color:var(--ink2)}
.search{margin:16px 0 10px;width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font-size:15px;outline:none}
.search:focus{border-color:var(--accent)}
.chips{display:flex;gap:7px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:5px 12px;border-radius:999px;background:var(--chip);font-size:13px;color:var(--ink2);white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg)}

/* cards */
.card{display:block;text-decoration:none;color:inherit;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:18px 18px 16px;margin:12px 0;position:relative}
.card .meta{font-family:var(--mono);font-size:11px;color:var(--ink3);letter-spacing:.04em;display:flex;gap:10px;flex-wrap:wrap}
.card .meta .cat{color:var(--accent)}
.card h2{font-family:var(--serif);font-size:20px;line-height:1.35;margin:8px 0 4px}
.card .en{font-size:13px;color:var(--ink3);font-style:italic}
.card p{margin:8px 0 10px;color:var(--ink2);font-size:14.5px}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:11.5px;padding:2px 8px;border-radius:6px;background:var(--chip);color:var(--ink2)}
.readdot{position:absolute;top:18px;right:18px;font-size:11px;color:var(--ink3);font-family:var(--mono)}
.empty{color:var(--ink3);text-align:center;padding:40px 0;font-size:14px}

/* entry */
.topbar{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(var(--top) + 8px) 0 0;margin-top:calc(-1 * var(--top))}
.back{font-size:14px;color:var(--ink2);padding:6px 0;display:inline-flex;align-items:center;gap:4px}
.ehead{padding:6px 0 4px}
.ehead h1{font-family:var(--serif);font-size:26px;line-height:1.3;margin:6px 0 2px;font-weight:900}
.ehead .en{color:var(--ink3);font-style:italic;font-size:14px}
.src{font-size:13px;color:var(--ink2);margin:10px 0}
.src a{word-break:break-all}
.tldr{background:var(--paper);border-left:3px solid var(--accent);padding:14px 16px;border-radius:0 12px 12px 0;margin:14px 0;font-size:15px}
.tldr b{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--accent);display:block;margin-bottom:4px}
.gold{margin:14px 0 6px;display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;scrollbar-width:none}
.gold::-webkit-scrollbar{display:none}
.gold div{flex:none;width:78%;scroll-snap-align:start;background:var(--ink);color:var(--bg);border-radius:14px;padding:16px 18px;font-family:var(--serif);font-size:17px;line-height:1.45}
.tabs{display:flex;gap:4px;overflow-x:auto;padding:10px 0 10px;border-bottom:1px solid var(--line);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:6px 12px;border-radius:999px;font-size:14px;color:var(--ink2)}
.tab.on{background:var(--accent);color:#fff}
.tab small{font-family:var(--mono);font-size:10px;opacity:.7;margin-left:3px}

.sec{background:var(--paper);border:1px solid var(--line);border-radius:14px;margin:12px 0;overflow:hidden}
.sec>summary{list-style:none;padding:14px 16px;font-family:var(--serif);font-weight:700;font-size:16.5px;cursor:pointer;display:flex;justify-content:space-between;gap:10px}
.sec>summary::-webkit-details-marker{display:none}
.sec>summary::after{content:"+";font-family:var(--mono);color:var(--ink3);font-weight:400}
.sec[open]>summary::after{content:"–"}
.sec .body{padding:0 16px 14px;font-size:15px;color:var(--ink)}
.body p{margin:0 0 10px}
.body b{color:var(--ink);background:linear-gradient(transparent 62%,var(--accent-soft) 62%)}

.vp{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
.vp .n{font-family:var(--mono);font-size:11px;color:var(--accent)}
.vp h3{font-family:var(--serif);font-size:17px;margin:4px 0 8px;line-height:1.4}
.vp p{margin:0 0 8px;font-size:14.5px;color:var(--ink2)}
.vp .str{font-size:13px;color:var(--ink);background:var(--chip);border-radius:8px;padding:7px 10px}
.vp .str::before{content:"评估 · ";font-family:var(--mono);font-size:11px;color:var(--ink3)}

.qa .q{font-family:var(--serif);font-weight:700;font-size:17px;line-height:1.45;margin:0 0 8px}
.qa .q::before{content:"问 ";color:var(--accent)}

.ex{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
.ex h3{font-family:var(--serif);font-size:17px;margin:0 0 10px;line-height:1.4;padding-right:36px}
.ex .row{margin:0 0 8px;font-size:14.5px}
.ex .lab{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--ink3);display:block}
.ex .eg{background:var(--chip);border-radius:8px;padding:8px 10px;color:var(--ink)}
.ex .use{border-left:2px solid var(--accent);padding-left:10px}
.ex .from{font-size:12px;color:var(--ink3);margin-top:6px}
.star{position:absolute;right:12px;top:12px;font-size:20px;color:var(--ink3);padding:4px}
.star.on{color:var(--accent)}
.rel{position:relative}

.cc{display:grid;grid-template-columns:1fr;gap:10px;margin:10px 0}
.cpt{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.cpt .nm{font-family:var(--serif);font-weight:700;font-size:16px}
.cpt .en{font-size:12.5px;color:var(--ink3);font-style:italic}
.cpt .who{font-size:12.5px;color:var(--ink2);margin:2px 0 4px;font-family:var(--mono)}
.cpt .g{font-size:14px}
.cpt .from{font-size:12px;color:var(--ink3);margin-top:4px}
.grp{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--accent);margin:22px 0 4px;text-transform:uppercase}
.note{font-size:12.5px;color:var(--ink3);margin:16px 0;line-height:1.6}

/* bottom nav */
nav.bn{position:fixed;left:0;right:0;bottom:0;z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:var(--bot)}
nav.bn .in{max-width:680px;margin:0 auto;display:flex}
nav.bn a{flex:1;text-align:center;text-decoration:none;color:var(--ink3);font-size:12px;padding:8px 0 9px;line-height:1.3}
nav.bn a i{display:block;font-style:normal;font-family:var(--serif);font-size:19px;font-weight:900}
nav.bn a.on{color:var(--accent)}
</style>
</head>
<body>
<main id="app" class="wrap"><div class="empty">加载中…</div></main>
<nav class="bn"><div class="in">
  <a href="#home" data-v="home"><i>册</i>手册</a>
  <a href="#concepts" data-v="concepts"><i>概</i>概念库</a>
  <a href="#craft" data-v="craft"><i>文</i>表达库</a>
</div></nav>
<script>
(function(){
const app=document.getElementById('app');
const S={catalog:null,entries:{},filter:'全部',q:'',tab:{} ,craftFilter:'全部'};
const store={
  get(k,d){try{const v=localStorage.getItem('gd_'+k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem('gd_'+k,JSON.stringify(v))}catch(e){}}
};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const md=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
const paras=s=>String(s||'').split('\n').filter(Boolean).map(p=>'<p>'+md(p)+'</p>').join('');

async function load(){
  try{
    const r=await fetch('data/catalog.json',{cache:'no-cache'});
    S.catalog=await r.json();
    await Promise.all(S.catalog.entries.map(async e=>{
      try{const x=await fetch(e.file,{cache:'no-cache'});S.entries[e.id]=await x.json()}catch(err){}
    }));
  }catch(err){app.innerHTML='<div class="empty">数据加载失败，请刷新重试。</div>';return}
  route();
  if('serviceWorker' in navigator)
    navigator.serviceWorker.ready.then(reg=>reg.active&&reg.active.postMessage({type:'prefetch',urls:['data/catalog.json',...S.catalog.entries.map(e=>e.file)]})).catch(()=>{});
}
function allConcepts(){const out=[];S.catalog.entries.forEach(m=>{const e=S.entries[m.id];(e&&e.concepts||[]).forEach(c=>out.push({...c,_id:m.id,_t:m.title_zh}))});return out}
function allCraft(){const out=[];S.catalog.entries.forEach(m=>{const e=S.entries[m.id];(e&&e.expression||[]).forEach((c,i)=>out.push({...c,_id:m.id,_t:m.title_zh,_k:m.id+':'+i}))});return out}

function setNav(v){document.querySelectorAll('nav.bn a').forEach(a=>a.classList.toggle('on',a.dataset.v===v))}

function home(){
  setNav('home');
  const es=[...S.catalog.entries].map((e,i)=>[e,i]).sort((a,b)=>b[0].added.localeCompare(a[0].added)||a[1]-b[1]).map(x=>x[0]);
  const cats=['全部',...new Set(es.map(e=>e.category))];
  const tags=[...new Set(es.flatMap(e=>e.tags))];
  const read=store.get('read',{});
  const q=S.q.trim().toLowerCase();
  const list=es.filter(e=>{
    if(S.filter!=='全部' && e.category!==S.filter && !e.tags.includes(S.filter))return false;
    if(!q)return true;
    const full=S.entries[e.id];
    return JSON.stringify(full||e).toLowerCase().includes(q);
  });
  const nC=allConcepts().length,nX=allCraft().length;
  app.innerHTML=`
  <header class="mast">
    <div class="kicker">Field Notes · 每周收集</div>
    <h1>观点<span>手册</span></h1>
    <div class="stats">${es.length} 篇 · ${nC} 个概念 · ${nX} 种表达方式</div>
  </header>
  <input class="search" id="q" type="search" placeholder="搜索观点、概念、人名…" value="${esc(S.q)}">
  <div class="chips">${[...cats,...tags.filter(t=>!cats.includes(t))].map(c=>`<button class="chip ${S.filter===c?'on':''}" data-f="${esc(c)}">${esc(c)}</button>`).join('')}</div>
  ${list.length?list.map(e=>`
    <a class="card" href="#e-${esc(e.id)}">
      ${read[e.id]?'<span class="readdot">已读</span>':''}
      <div class="meta"><span class="cat">${esc(e.category)}</span><span>${esc(e.source_type)}</span><span>${esc(e.author)}</span><span>${esc(e.added)}</span></div>
      <h2>${esc(e.title_zh)}</h2>
      <div class="en">${esc(e.title)}</div>
      <p>${esc(e.summary)}</p>
      <div class="tags">${e.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>
    </a>`).join(''):'<div class="empty">没有匹配的内容</div>'}
  <div class="note">每周发来新内容后，这里会多出一篇；概念库和表达库会自动汇总所有篇目，内容多了以后再按主题重新分类。</div>`;
  const qi=document.getElementById('q');
  qi.addEventListener('input',()=>{S.q=qi.value;const pos=qi.selectionStart;home();const n=document.getElementById('q');n.focus();try{n.setSelectionRange(pos,pos)}catch(e){}});
  app.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{S.filter=b.dataset.f;home()});
}

const TABS=[['handbook','手册'],['viewpoints','观点'],['thinking','思考'],['derived','衍生'],['expression','表达'],['concepts','概念']];
function entry(id){
  setNav('home');
  const e=S.entries[id];
  if(!e){app.innerHTML='<div class="empty">找不到这篇</div>';return}
  const read=store.get('read',{});read[id]=1;store.set('read',read);
  const tab=S.tab[id]||'handbook';
  const s=e.source||{};
  app.innerHTML=`
  <div class="topbar"><a class="back" href="#home">‹ 返回</a></div>
  <div class="ehead">
    <div style="font-family:var(--mono);font-size:11px;color:var(--ink3)"><span style="color:var(--accent)">${esc(e.category)}</span> · ${esc(s.type)} · ${esc(s.added)}</div>
    <h1>${esc(e.title_zh)}</h1>
    <div class="en">${esc(e.title)}</div>
    <div class="src">${esc(s.channel||s.author)} · <a href="${esc(s.url)}" target="_blank" rel="noopener">原${esc(s.type)} ↗</a></div>
  </div>
  <div class="tldr"><b>一句话</b>${md(e.tldr)}</div>
  ${(e.golden_lines||[]).length?`<div class="gold">${e.golden_lines.map(g=>`<div>${esc(g)}</div>`).join('')}</div>`:''}
  <div class="tabs">${TABS.map(([k,n])=>`<button class="tab ${tab===k?'on':''}" data-t="${k}">${n}<small>${(e[k]||[]).length}</small></button>`).join('')}</div>
  <div id="pane">${pane(e,tab)}</div>
  ${s.note?`<div class="note">注：${esc(s.note)}</div>`:''}`;
  app.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{S.tab[id]=b.dataset.t;entry(id)});
  bindStars();
}
function pane(e,tab){
  const L=e[tab]||[];
  if(tab==='handbook')return L.map((h,i)=>`<details class="sec" ${i<2?'open':''}><summary>${esc(h.heading)}</summary><div class="body">${paras(h.body)}</div></details>`).join('');
  if(tab==='viewpoints')return L.map((v,i)=>`<div class="vp"><div class="n">观点 ${String(i+1).padStart(2,'0')}</div><h3>${esc(v.claim)}</h3><p>${md(v.support)}</p>${v.strength?`<div class="str">${esc(v.strength)}</div>`:''}</div>`).join('');
  if(tab==='thinking')return L.map(t=>`<div class="vp qa"><div class="q">${esc(t.q)}</div><div class="body">${paras(t.a)}</div></div>`).join('');
  if(tab==='derived')return L.map((d,i)=>`<details class="sec" ${i===0?'open':''}><summary>${esc(d.title)}</summary><div class="body">${paras(d.body)}</div></details>`).join('');
  if(tab==='expression')return L.map((x,i)=>exCard({...x,_k:e.id+':'+i},false)).join('');
  if(tab==='concepts')return `<div class="cc">${L.map(c=>cpt(c,false)).join('')}</div>`;
  return '';
}
function exCard(x,showFrom){
  const st=store.get('stars',{});
  return `<div class="ex rel">
    <button class="star ${st[x._k]?'on':''}" data-s="${esc(x._k)}" aria-label="想练">${st[x._k]?'★':'☆'}</button>
    <h3>${esc(x.technique)}</h3>
    <div class="row"><span class="lab">原文怎么做</span><div class="eg">${md(x.example)}</div></div>
    <div class="row"><span class="lab">为什么有效</span>${md(x.why)}</div>
    <div class="row use"><span class="lab">我可以怎么用</span>${md(x.use)}</div>
    ${showFrom?`<div class="from">出自 · <a href="#e-${esc(x._id)}">${esc(x._t)}</a></div>`:''}
  </div>`;
}
function cpt(c,showFrom){
  return `<div class="cpt"><div class="nm">${esc(c.name)}</div><div class="en">${esc(c.en)}</div><div class="who">${esc(c.who)} · ${esc(c.year)}</div><div class="g">${esc(c.gist)}</div>${showFrom?`<div class="from">出自 · <a href="#e-${esc(c._id)}">${esc(c._t)}</a></div>`:''}</div>`;
}
function bindStars(){
  app.querySelectorAll('[data-s]').forEach(b=>b.onclick=ev=>{ev.preventDefault();const st=store.get('stars',{});const k=b.dataset.s;if(st[k])delete st[k];else st[k]=1;store.set('stars',st);b.classList.toggle('on',!!st[k]);b.textContent=st[k]?'★':'☆'});
}
function concepts(){
  setNav('concepts');
  const cs=allConcepts();
  const by={};cs.forEach(c=>{(by[c.field]=by[c.field]||[]).push(c)});
  const fields=Object.keys(by).sort((a,b)=>by[b].length-by[a].length);
  app.innerHTML=`<header class="mast"><div class="kicker">Concepts</div><h1>概念<span>库</span></h1><div class="stats">${cs.length} 个概念，按学科分组，跨篇目汇总</div></header>
  ${fields.map(f=>`<div class="grp">${esc(f)} · ${by[f].length}</div><div class="cc">${by[f].map(c=>cpt(c,true)).join('')}</div>`).join('')}`;
}
function craft(){
  setNav('craft');
  const st=store.get('stars',{});
  let xs=allCraft();
  const nStar=xs.filter(x=>st[x._k]).length;
  if(S.craftFilter==='想练')xs=xs.filter(x=>st[x._k]);
  app.innerHTML=`<header class="mast"><div class="kicker">Craft of Expression</div><h1>表达<span>库</span></h1><div class="stats">从每篇内容里学到的表达方式。点 ☆ 标记想练的。</div></header>
  <div class="chips"><button class="chip ${S.craftFilter==='全部'?'on':''}" data-c="全部">全部 ${allCraft().length}</button><button class="chip ${S.craftFilter==='想练'?'on':''}" data-c="想练">★ 想练 ${nStar}</button></div>
  ${xs.length?xs.map(x=>exCard(x,true)).join(''):'<div class="empty">还没有标记想练的表达方式</div>'}`;
  app.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{S.craftFilter=b.dataset.c;craft()});
  bindStars();
}
function route(){
  if(!S.catalog)return;
  const h=(location.hash||'').slice(1);
  window.scrollTo(0,0);
  if(h.startsWith('e-'))entry(h.slice(2));
  else if(h==='concepts')concepts();
  else if(h==='craft')craft();
  else home();
}
window.addEventListener('hashchange',route);
load();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
</body>
</html>
